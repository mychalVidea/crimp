[workspace]
members = [".", "crimp-proto", "crimp-ui"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
crimp-proto = { path = "crimp-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[package]
name = "crimp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ultralehký PipeWire routing, virtual-sink & blocklist daemon pro Linux, který chrání uživatelskou audio topologii před nechtěným přepojováním WirePlumberu."
keywords = ["pipewire", "audio", "routing", "daemon", "linux"]
categories = ["multimedia::audio", "os::linux-apis"]

[dependencies]
crimp-proto = { workspace = true }
pipewire = "0.10"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ctrlc = { version = "3.4", features = ["termination"] }
thiserror = { workspace = true }

[profile.release]
strip = "symbols"
lto = "thin"
