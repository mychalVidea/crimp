[package]
name = "crimp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ultralehký PipeWire routing & blocklist daemon pro Linux, který chrání uživatelskou audio topologii před nechtěným přepojováním WirePlumberu."
keywords = ["pipewire", "audio", "routing", "daemon", "linux"]
categories = ["multimedia::audio", "os::linux-apis"]

[dependencies]
pipewire = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
ctrlc = { version = "3.4", features = ["termination"] }
thiserror = "2"
